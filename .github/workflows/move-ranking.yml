name: Mover ranking.js a api (temporal)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mover ranking.js a api/
        run: |
          mkdir -p api
          git mv ranking.js api/ranking.js
          git config user.name "Jhonaruto1"
          git config user.email "jhonnavi18@gmail.com"
          git commit -m "Mueve ranking.js a api/ranking.js"
          git push
