name: Renombrar juego a index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renombrar archivo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv juego-flappy-bird.html index.html
          git commit -m "Rename juego-flappy-bird.html to index.html"
          git push

















