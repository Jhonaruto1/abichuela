name: Renombrar juego a index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renombrar juego-flappy-bird.html a index.html
        run: |
          mv juego-flappy-bird.html index.html
          git config user.name "Jhonaruto1"
          git config user.email "jhonnavi18@gmail.com"
          git add -A
          git commit -m "Reemplaza index.html con la nueva versión del juego Flappy Bird: poderes, campo de nombre e ítems cada 15 tuberías"
          git push
